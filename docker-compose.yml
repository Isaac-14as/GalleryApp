name: gallery

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      MINIO_SITE_ADDRESS: ${MINIO_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "9003:9003"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./GallerClient
      args:
        VITE_SERVER_URL: /api
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./GalleryServer
    restart: unless-stopped
    environment:
      DEBUG: "false"
      ROOT_PATH: /api
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      HOST: db
      APP_PORT: "8000"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: "5432"
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_INTERNAL_HOST: minio
      MINIO_INTERNAL_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_GET_EXPIRE_MINUTES: ${MINIO_GET_EXPIRE_MINUTES:-360}
      MINIO_PUT_EXPIRE_MINUTES: ${MINIO_PUT_EXPIRE_MINUTES:-60}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
